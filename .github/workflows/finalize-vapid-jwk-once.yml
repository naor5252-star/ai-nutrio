name: Finalize VAPID JWK once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-vapid-jwk-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Format
        run: npx prettier --write src/server/services/web-push.ts

      - name: Full CI
        run: npm run ci

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/services/web-push.ts
          git rm .github/workflows/finalize-vapid-jwk-once.yml
          git commit -m "Finalize canonical VAPID JWK signing"
          git push origin HEAD:main

      - name: Deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
