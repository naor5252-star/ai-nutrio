name: Finalize weekly coach context once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-weekly-coach-context-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Format
        run: |
          npx prettier --write \
            src/server/api/coach-routes.ts \
            src/server/ai/text-generator.ts

      - name: Full CI
        run: npm run ci

      - name: Commit final result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/api/coach-routes.ts src/server/ai/text-generator.ts
          git rm .github/workflows/finalize-weekly-coach-context-once.yml
          git commit -m "Finalize weekly AI coach context"
          git push origin HEAD:main

      - name: Deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
