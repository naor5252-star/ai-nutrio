name: Finalize product label AI once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-product-label-ai-once.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: |
          npx prettier --write \
            src/server/ai/product-label-scanner.ts \
            src/client/features/products/ProductsPage.tsx

      - name: Run full CI
        run: npm run ci

      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/server/ai/product-label-scanner.ts \
            src/client/features/products/ProductsPage.tsx
          git rm .github/workflows/finalize-product-label-ai-once.yml
          git commit -m "Finalize compact product label AI scan"
          git push origin HEAD:main
