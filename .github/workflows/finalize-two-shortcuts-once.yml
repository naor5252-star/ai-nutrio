name: Finalize two health shortcuts once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-two-shortcuts-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format changed files
        run: |
          npx prettier --write \
            src/server/api/garmin-routes.ts \
            docs/APPLE-HEALTH-SHORTCUT.md

      - name: Run full CI
        run: npm run ci

      - name: Commit final formatting and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/api/garmin-routes.ts docs/APPLE-HEALTH-SHORTCUT.md
          git rm .github/workflows/finalize-two-shortcuts-once.yml
          git commit -m "Finalize separate iPhone and Garmin shortcuts"
          git push origin HEAD:main

      - name: Trigger normal validation and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
