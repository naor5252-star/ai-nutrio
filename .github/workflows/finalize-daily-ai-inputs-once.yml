name: Finalize daily AI inputs once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-daily-ai-inputs-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Format client
        run: npx prettier --write src/client

      - name: Full CI
        run: npm run ci

      - name: Commit final result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/finalize-daily-ai-inputs-once.yml
          git add -A
          git commit -m "Finalize daily AI input history"
          git push origin HEAD:main

      - name: Deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

