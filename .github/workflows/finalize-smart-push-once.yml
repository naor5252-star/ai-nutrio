name: Finalize smart push once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-smart-push-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Format changed files
        run: |
          npx prettier --write \
            public/sw.js \
            src/client/features/settings/PushNotificationSettings.tsx \
            src/client/features/settings/SettingsPage.tsx \
            src/server/api/push-routes.ts \
            src/server/services/web-push.ts \
            src/server/scheduled/smart-notifications.ts \
            src/server/scheduled/cleanup.ts \
            src/worker.ts

      - run: npm run ci

      - name: Commit final result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            migrations/0004_smart_push_notifications.sql \
            public/sw.js \
            src/client/features/settings/PushNotificationSettings.tsx \
            src/client/features/settings/SettingsPage.tsx \
            src/server/api/push-routes.ts \
            src/server/services/web-push.ts \
            src/server/scheduled/smart-notifications.ts \
            src/server/scheduled/cleanup.ts \
            src/worker.ts

          git rm .github/workflows/finalize-smart-push-once.yml
          git commit -m "Finalize AI smart push notifications"
          git push origin HEAD:main

      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
