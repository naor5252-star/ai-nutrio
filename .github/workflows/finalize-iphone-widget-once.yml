name: Finalize iPhone widget once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-iphone-widget-once.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: |
          npx prettier --write \
            src/server/api/garmin-routes.ts \
            docs/iphone-widget/rega-tov-widget.js

      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/server/api/garmin-routes.ts \
            docs/iphone-widget/rega-tov-widget.js
          git rm .github/workflows/finalize-iphone-widget-once.yml
          git commit -m "Finalize iPhone calorie balance widget"
          git push origin HEAD:main

# retrigger formatter
