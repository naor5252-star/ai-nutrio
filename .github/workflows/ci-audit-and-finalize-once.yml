name: CI audit and finalize once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci-audit-and-finalize-once.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Auto-fix formatting and safe lint fixes
        run: |
          npx prettier --write \
            src/server/ai/text-generator.ts \
            src/server/scheduled/smart-notifications.ts \
            src/client/features/settings/PushNotificationSettings.tsx \
            .github/workflows/ci-audit-and-finalize-once.yml

          npx eslint \
            src/server/ai/text-generator.ts \
            src/server/scheduled/smart-notifications.ts \
            src/client/features/settings/PushNotificationSettings.tsx \
            --fix

      - name: Run every CI check and report all failures
        shell: bash
        run: |
          set +e
          failures=0

          run_check() {
            name="$1"
            shift
            echo "::group::${name}"
            "$@"
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error::${name} failed with exit code ${status}"
              failures=$((failures + 1))
            else
              echo "${name}: PASS"
            fi
            echo "::endgroup::"
          }

          run_check "Prettier" npm run format:check
          run_check "ESLint" npm run lint
          run_check "TypeScript" npm run typecheck
          run_check "Unit tests" npm run test
          run_check "Migration validation" npm run validate:migrations
          run_check "Production build" npm run build
          run_check "Install Playwright WebKit" npx playwright install --with-deps webkit
          run_check "E2E tests" npm run test:e2e

          echo "Total failing checks: ${failures}"
          if [ "$failures" -ne 0 ]; then
            exit 1
          fi

      - name: Commit final clean state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/server/ai/text-generator.ts \
            src/server/scheduled/smart-notifications.ts \
            src/client/features/settings/PushNotificationSettings.tsx

          git rm .github/workflows/ci-audit-and-finalize-once.yml

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Finalize workflow and AI fixes"
            git push origin HEAD:main
          fi
