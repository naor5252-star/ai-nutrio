name: Prettier Debug

on:
  push:
    paths:
      - ".github/workflows/prettier-debug.yml"

jobs:
  prettier-debug:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Show exact Prettier diff
        run: |
          npx prettier --write src/client/features/diary/HomePage.tsx
          echo "===== PRETTIER DIFF ====="
          git diff -- src/client/features/diary/HomePage.tsx
          exit 1
