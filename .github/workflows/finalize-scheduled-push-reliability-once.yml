name: Finalize scheduled push reliability once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-scheduled-push-reliability-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Format
        run: |
          npx prettier --write \
            wrangler.jsonc \
            src/worker.ts \
            src/server/api/push-routes.ts \
            src/server/scheduled/smart-notifications.ts \
            src/client/features/settings/PushNotificationSettings.tsx

      - name: Full CI
        run: npm run ci

      - name: Commit final result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            wrangler.jsonc \
            src/worker.ts \
            src/server/api/push-routes.ts \
            src/server/scheduled/smart-notifications.ts \
            src/client/features/settings/PushNotificationSettings.tsx

          git rm .github/workflows/finalize-scheduled-push-reliability-once.yml
          git commit -m "Finalize reliable scheduled push notifications"
          git push origin HEAD:main

      - name: Deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
