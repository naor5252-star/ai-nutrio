name: Finalize simple vision JSON once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-simple-vision-json-once.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: |
          npx prettier --write \
            src/shared/schemas/meal-analysis.ts \
            src/client/app/types.ts \
            src/server/ai/model-router.ts \
            src/client/features/capture/AnalysisReviewPage.tsx

      - name: Run full CI on formatted code
        run: npm run ci

      - name: Commit formatted files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/shared/schemas/meal-analysis.ts \
            src/client/app/types.ts \
            src/server/ai/model-router.ts \
            src/client/features/capture/AnalysisReviewPage.tsx

          git rm .github/workflows/finalize-simple-vision-json-once.yml
          git commit -m "Finalize simple AI vision JSON contract"
          git push origin HEAD:main
