name: Urgent format health files

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/urgent-format-two-health-files.yml"

permissions:
  contents: write
  actions: write

jobs:
  format-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prettier write
        run: |
          npx prettier --write \
            docs/APPLE-HEALTH-SHORTCUT.md \
            src/server/api/garmin-routes.ts

      - name: Run full CI
        run: npm run ci

      - name: Commit formatted files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            docs/APPLE-HEALTH-SHORTCUT.md \
            src/server/api/garmin-routes.ts

          git rm .github/workflows/urgent-format-two-health-files.yml
          git commit -m "Format separate iPhone and Garmin shortcut support"
          git push origin HEAD:main

      - name: Trigger deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
