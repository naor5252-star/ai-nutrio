name: Finalize CI recovery once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-ci-recovery-once.yml"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format and apply safe lint fixes
        run: |
          npx prettier --write \
            src/server/ai/text-generator.ts \
            src/server/scheduled/smart-notifications.ts \
            src/client/features/settings/PushNotificationSettings.tsx \
            .github/workflows/finalize-ci-recovery-once.yml

          npx eslint \
            src/server/ai/text-generator.ts \
            src/server/scheduled/smart-notifications.ts \
            src/client/features/settings/PushNotificationSettings.tsx \
            --fix

          # ESLint can occasionally change formatting, so finish with Prettier.
          npx prettier --write \
            src/server/ai/text-generator.ts \
            src/server/scheduled/smart-notifications.ts \
            src/client/features/settings/PushNotificationSettings.tsx

      - name: Run all CI checks and show every failure
        shell: bash
        run: |
          set +e
          failures=0

          run_check() {
            name="$1"
            shift
            echo "::group::${name}"
            "$@"
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error::${name} failed with exit code ${status}"
              failures=$((failures + 1))
            else
              echo "${name}: PASS"
            fi
            echo "::endgroup::"
          }

          run_check "Prettier" npm run format:check
          run_check "ESLint" npm run lint
          run_check "TypeScript" npm run typecheck
          run_check "Unit tests" npm run test
          run_check "Migration validation" npm run validate:migrations
          run_check "Production build" npm run build

          echo "Total core CI failures: ${failures}"
          if [ "$failures" -ne 0 ]; then
            exit 1
          fi

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: Run E2E
        run: npm run test:e2e

      - name: Commit clean state and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/server/ai/text-generator.ts \
            src/server/scheduled/smart-notifications.ts \
            src/client/features/settings/PushNotificationSettings.tsx

          git rm .github/workflows/finalize-ci-recovery-once.yml

          git commit -m "Finalize CI recovery"
          git push origin HEAD:main
